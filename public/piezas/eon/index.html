<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rosetta · E.ON · expansión de red</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{ --oro:#ffb648; --ambar:#e08a1e; --tinta:#0a0906; --texto:#e8e0d2; --tenue:#9a9382; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0906}
  body{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; font-size:13px; color:var(--texto)}
  canvas{display:block; position:fixed; inset:0; z-index:1}
  .capa{position:fixed; inset:0; pointer-events:none; z-index:3}
  .marco{position:fixed; padding:20px 22px}
  .tl{top:0;left:0} .tr{top:0;right:0;text-align:right}
  h1{font-family:'Share Tech Mono',monospace; font-size:19px; font-weight:400; margin:0; letter-spacing:1.5px}
  h1 i{font-style:normal;color:var(--oro)}
  .lema{color:var(--tenue); font-size:11.5px; margin-top:5px; max-width:360px; line-height:1.6}
  .cifra{font-family:'Share Tech Mono',monospace; font-size:30px; line-height:1; color:var(--oro)}
  .cifra small{display:block; font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--tenue); letter-spacing:.4px; margin-top:4px}
  .barra{
    position:fixed; left:0; right:0; bottom:0; background:#080705; border-top:1px solid #241f16;
    display:flex; align-items:center; gap:16px; padding:9px 16px; font-size:11.5px; color:var(--tenue); z-index:5;
  }
  .barra button{background:#12100b;color:var(--texto);border:1px solid #2e2819;font:inherit;font-size:11.5px;padding:5px 11px;cursor:pointer}
  .barra button[aria-pressed="true"]{border-color:var(--oro);color:var(--oro)}
  .proc{position:fixed; left:22px; bottom:52px; font-size:10px; color:#6b6455; line-height:1.6; max-width:520px; z-index:4; word-break:break-all}
  #veredicto{position:fixed; right:22px; bottom:52px; text-align:right; z-index:4; font-size:11.5px; line-height:1.6}
  #veredicto b{color:var(--oro); font-size:14px}
  #ficha{position:fixed;pointer-events:none;background:rgba(10,9,6,.96);border:1px solid var(--oro);padding:7px 9px;font-size:11px;line-height:1.5;display:none;z-index:6}
  #cargando{position:fixed; inset:0; display:grid; place-items:center; color:var(--tenue)}
</style>
</head>
<body>
<div id="cargando">abriendo el sello de E.ON…</div>
<div class="capa">
  <div class="marco tl">
    <h1>E.ON <i>·</i> EXPANSIÓN DE RED</h1>
    <div class="lema" id="lema"></div>
  </div>
  <div class="marco tr" id="cifras"></div>
</div>
<div class="proc" id="proc"></div>
<div id="veredicto"></div>
<div id="ficha"></div>
<div class="barra">
  <span id="solvers" style="display:flex;gap:6px"></span>
  <button id="orbita">órbita</button>
  <span style="flex:1"></span>
  <span id="pie"></span>
</div>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.js" } }</script>
<script type="module" src="./app.js"></script>
</body>
</html>
