# Deploy a producción en cada push a main.
# prod = git push. Cualquier actor con acceso al repo publica; el historial de CI
# queda como auditoría de cada deploy.
#
# Secrets requeridos (repo Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN — token con: Workers Scripts:Edit, D1:Edit,
#                          Zone.Cache Purge (zona rosettaquantum.com)
#   CLOUDFLARE_ACCOUNT_ID — id de la cuenta (6398d10da6c1f1e8b38b5e7c15d2410f)

name: Deploy to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # prebuild = sync-ledger: lee la D1 real; si falla usa el snapshot commiteado
      # y este paso lo anuncia como warning para que el fallback nunca pase piola
      - name: Build (ledger desde D1)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # cada pagina publica este sha en <meta name="rq-build">, y los chequeos
          # esperan a que el edge sirva ESTE build antes de mirar nada
          GITHUB_SHA: ${{ github.sha }}
        run: |
          npm run build 2>&1 | tee build.log
          if grep -q "D1 unreachable" build.log; then
            echo "::warning::sync-ledger cayó al snapshot — el token no pudo leer la D1 (falta permiso D1:Edit)"
          else
            grep "\[sync-ledger\]" build.log | head -1 | sed 's/^/::notice::/'
          fi

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # wrangler FIJADO en package.json y llamado desde node_modules. Con `npx
        # wrangler` a secas, cada deploy bajaba la ultima version publicada: el
        # 2026-08-12 una de ellas pedia miniflare@5.20260811.0-alpha, que no existe en
        # el registro, y el deploy murio por un paquete de un tercero sin que nada
        # nuestro hubiera cambiado. Una herramienta de despliegue sin version fija es
        # una dependencia de terceros en el camino critico.
        run: ./node_modules/.bin/wrangler deploy

      # el edge puede servir HTML viejo tras el deploy — purga deseable, pero un
      # token sin Zone.Cache Purge no debe tumbar el deploy: warning y seguimos
      - name: Purge cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if curl -fsS -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            "https://api.cloudflare.com/client/v4/zones/94bbdb88e7e8252bec59a17d32a4190e/purge_cache"; then
            echo "::notice::caché purgado"
          else
            echo "::warning::purga falló (al token le falta Zone → Cache Purge de rosettaquantum.com) — el edge servirá lo viejo hasta expirar TTL"
          fi

      - name: Smoke test
        run: |
          sleep 5
          for u in / /es/ /ledger /blog /llms.txt; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L "https://rosettaquantum.com$u")
            echo "$code  $u"
            [ "$code" = "200" ] || exit 1
          done

      # Los validadores del archivador tienen que gritar contra defectos inyectados.
      # Si este paso pasa "solo", el chequeo de abajo ya no prueba nada.
      - name: Self-test de los validadores del archivador
        run: node scripts/check-quantum-catalog.mjs --self-test

      # El motor de graficos: la mitad que importa es que los guardias GRITEN.
      # Un throw que nunca se prueba con el caso que debe atrapar es indistinguible
      # de un throw que alguien borro.
      # El renderizador del informe: sus tres defectos llegaron al PDF entregado y dos
      # sobrevivieron mas de una version, porque solo se veian generando el documento
      # entero y mirandolo. Cada caso esta escrito contra el markdown que lo produjo.
      - name: Tests del renderizador del informe
        run: node scripts/test-report-render.mjs

      - name: Tests del motor de graficos
        run: node scripts/test-charts.mjs

      # Los datos de la viz tienen que seguir siendo byte-identicos a los que salieron
      # del entregable sellado de Cleveland. Si alguien edita una coordenada, grita.
      - name: Verificar la viz de Cleveland
        run: node scripts/build-viz-cleveland.mjs --verificar

      # La pagina de precios se GENERA desde el documento que Nicholas aprobo. Si
      # alguien la edita a mano, o cambia el .md sin regenerar, esto grita: lo
      # publicado tiene que ser demostrablemente el texto aprobado.
      - name: La pagina de precios sigue siendo el texto aprobado
        run: node scripts/build-pricing.mjs --verificar

      # Las tres politicas se GENERAN desde los .md que Nicholas aprobo, anclados por
      # sha. Si alguien edita un .astro a mano o cambia un .md sin regenerar, grita.
      - name: Las politicas legales siguen siendo el texto aprobado
        run: node scripts/build-legal.mjs --verificar

      - name: Self-test de los comparadores de la especificacion
        run: node scripts/check-openapi.mjs --self-test

      # El sello de version va en TODA pagina servida, no solo en las de Astro: la consola
      # y las dos caras de Cleveland son HTML plano y nunca pasan por el layout, asi que
      # esperar su 200 no distinguia lo viejo de lo nuevo. El postbuild lo estampa y falla
      # cerrado; esto prueba que sabe estampar Y que no estampa dos veces.
      - name: Self-test del sello de version
        run: node scripts/test-sellar-version.mjs

      # Las zonas de la consola: riel, secciones y huecos tienen que corresponderse, las
      # zonas declaradas no pueden llevar cifras escritas a mano, y el pie tiene que
      # declarar EXACTAMENTE las rutas que el codigo pide. El --self-test rompe cada una
      # de esas reglas a proposito y exige que el guardia grite.
      - name: Self-test del guardia de zonas de la consola
        run: node scripts/test-consola-zonas.mjs --self-test

      - name: Las zonas de la consola cuadran
        run: node scripts/test-consola-zonas.mjs

      # El texto legible que emite la API: solo puede AGREGAR tildes al sellado. Corre
      # contra las fijas (textos reales del archivo) para no depender de la red; el modo
      # --vivo ejerce ademas lo que la API esta sirviendo de verdad.
      - name: El texto legible dice lo mismo que el sellado
        run: node scripts/test-legible.mjs

      # El contador de uso: lo que importa es que NUNCA pueda tumbar una respuesta.
      # El test fuerza el fallo de la escritura y comprueba que no propaga.
      - name: Tests del contador de uso
        run: node scripts/test-usage.mjs

      # El verificador de sellos y su familia de trampas de formato numerico.
      # Los vectores estan escritos contra los casos reales del archivo, y son los
      # que hay que volver a pasar cuando llegue el canonicalizador v3.
      - name: Vectores del verificador de sellos
        run: node scripts/test-sello.mjs

      # JCS (RFC 8785) para rosettaq-archive/v3. Implementacion independiente en JS,
      # escrita desde el RFC, que valida los vectores del laboratorio. Corre solo si
      # los vectores estan presentes: son de otro repo y pueden no estar en el clon.
      - name: Validacion cruzada de JCS (si hay vectores)
        run: |
          V="../../evidence-staging/jcs_vectores.json"
          S="sha256:8044a29a48c88184884b41708373a05715e13ce2d4b4db4bd312674ac5c96bcd"
          if [ -f "$V" ]; then node scripts/cross-jcs.mjs "$V" --sello "$S"; else echo "::notice::sin vectores JCS en este clon — se salta"; fi

      # Vigila lo desplegado, no el repo: que ninguna fila afirme sin cita, que el
      # catalogo no encoja, que nadie declare evidencia que no tiene, y que los
      # endpoints del ledger sigan intactos (api.js es compartido).
      - name: Chequeo del archivador contra produccion
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/check-quantum-catalog.mjs --esperar 120

      # Compara tres listas: lo que el enrutador atiende, lo que el catalogo
      # declara y lo que la especificacion servida publica. Y ejerce cada ruta
      # documentada: una especificacion que documenta un 404 pide confianza.
      - name: Chequeo de la especificacion OpenAPI
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/check-openapi.mjs --esperar 120
